[project]
id = "sdl"
version = "1.1.2"
src = "src"
work = "out/{target.name}/{profile.name}"
mach = "^7"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
env  = "msvc"
abi = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
env  = "macos"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
env  = "macos"
abi = "darwinpcs"

[profile.debug]
optimize       = false
debug          = true
simd           = "scalarize"
default        = true

[profile.release]
optimize       = true
debug          = false
simd           = "scalarize"



# the library, and the only artifact `mach build .` selects
[artifact.sdl]
kind    = "static"
default = true
export  = true
entry   = "lib/libsdl.mach"
out     = "{project.work}/lib/sdl"
targets = ["*"]
link    = ["sdl", "sdl-win", "sdl-darwin", "sdl-ttf", "sdl-ttf-win", "sdl-ttf-darwin", "sdl-image", "sdl-image-win", "sdl-image-darwin", "sdl-mixer", "sdl-mixer-win", "sdl-mixer-darwin"]
need    = []

[link.sdl]
source  = "system"
name    = "SDL3"
sys    = ["linux"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.sdl-win]
source  = "system"
include = "referenced"
name    = "SDL3.dll"
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.sdl-darwin]
source  = "system"
name    = "SDL3"
sys     = ["darwin"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-ttf]
source  = "system"
name    = "SDL3_ttf"
sys     = ["linux"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-ttf-win]
source  = "system"
include = "referenced"
name    = "SDL3_ttf.dll"
sys     = ["windows"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-ttf-darwin]
source  = "system"
name    = "SDL3_ttf"
sys     = ["darwin"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-image]
source  = "system"
name    = "SDL3_image"
sys     = ["linux"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-image-win]
source  = "system"
include = "referenced"
name    = "SDL3_image.dll"
sys     = ["windows"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-image-darwin]
source  = "system"
name    = "SDL3_image"
sys     = ["darwin"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-mixer]
source  = "system"
name    = "SDL3_mixer"
sys     = ["linux"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-mixer-win]
source  = "system"
include = "referenced"
name    = "SDL3_mixer.dll"
sys     = ["windows"]
arch    = ["*"]
abi     = ["*"]
export  = true

[link.sdl-mixer-darwin]
source  = "system"
name    = "SDL3_mixer"
sys     = ["darwin"]
arch    = ["*"]
abi     = ["*"]
export  = true

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
